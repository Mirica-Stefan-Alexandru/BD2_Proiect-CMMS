<?xml version="1.0" encoding="UTF-8"?>
<!-- Plansa demonstrativa in stilul unui export EPLAN Electric P8 (SVG).
     Etichetele de echipament (-QF1, -KM1, ...) sunt elemente <text>, exact
     ca in exportul EPLAN, si sunt detectate automat de vizualizatorul CMMS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1188 840" width="1188" height="840" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1188" height="840" fill="#ffffff"/>
  <rect x="20" y="20" width="1148" height="800" fill="none" stroke="#000" stroke-width="2"/>

  <!-- grila de coloane EPLAN -->
  <g font-size="11" fill="#000" text-anchor="middle">
    <text x="77" y="36">0</text><text x="191" y="36">1</text><text x="305" y="36">2</text>
    <text x="419" y="36">3</text><text x="533" y="36">4</text><text x="647" y="36">5</text>
    <text x="761" y="36">6</text><text x="875" y="36">7</text><text x="989" y="36">8</text>
    <text x="1103" y="36">9</text>
  </g>
  <line x1="20" y1="44" x2="1168" y2="44" stroke="#000" stroke-width="1"/>

  <!-- bare de alimentare L1 L2 L3 PE -->
  <g stroke="#000" stroke-width="1.6">
    <line x1="60" y1="90"  x2="640" y2="90"/>
    <line x1="60" y1="110" x2="640" y2="110"/>
    <line x1="60" y1="130" x2="640" y2="130"/>
    <line x1="60" y1="150" x2="640" y2="150" stroke-dasharray="8 4"/>
  </g>
  <g font-size="12" fill="#000">
    <text x="36" y="94">L1</text><text x="36" y="114">L2</text>
    <text x="36" y="134">L3</text><text x="36" y="154">PE</text>
  </g>

  <!-- -QF1 intrerupator automat -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <line x1="160" y1="90"  x2="160" y2="200"/>
    <line x1="180" y1="110" x2="180" y2="200"/>
    <line x1="200" y1="130" x2="200" y2="200"/>
    <rect x="145" y="200" width="70" height="60"/>
    <line x1="160" y1="210" x2="172" y2="248"/>
    <line x1="180" y1="210" x2="192" y2="248"/>
    <line x1="200" y1="210" x2="212" y2="248"/>
    <line x1="160" y1="260" x2="160" y2="320"/>
    <line x1="180" y1="260" x2="180" y2="320"/>
    <line x1="200" y1="260" x2="200" y2="320"/>
  </g>
  <text x="228" y="226" font-size="15" font-weight="bold" fill="#000">-QF1</text>
  <text x="228" y="244" font-size="10" fill="#333">32A / C</text>

  <!-- -KM1 contactor -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <rect x="145" y="320" width="70" height="60"/>
    <line x1="160" y1="330" x2="172" y2="368"/>
    <line x1="180" y1="330" x2="192" y2="368"/>
    <line x1="200" y1="330" x2="212" y2="368"/>
    <line x1="160" y1="380" x2="160" y2="440"/>
    <line x1="180" y1="380" x2="180" y2="440"/>
    <line x1="200" y1="380" x2="200" y2="440"/>
  </g>
  <text x="228" y="346" font-size="15" font-weight="bold" fill="#000">-KM1</text>
  <text x="228" y="364" font-size="10" fill="#333">18.5kW AC3</text>

  <!-- -FR1 releu termic -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <rect x="145" y="440" width="70" height="50"/>
    <path d="M155 465 h10 v-10 h10 v20 h10 v-10 h20"/>
    <line x1="160" y1="490" x2="160" y2="560"/>
    <line x1="180" y1="490" x2="180" y2="560"/>
    <line x1="200" y1="490" x2="200" y2="560"/>
  </g>
  <text x="228" y="466" font-size="15" font-weight="bold" fill="#000">-FR1</text>
  <text x="228" y="484" font-size="10" fill="#333">28-36A</text>

  <!-- -X1 cleme -->
  <g stroke="#000" stroke-width="1.4" fill="#fff">
    <rect x="150" y="560" width="20" height="16"/>
    <rect x="170" y="560" width="20" height="16"/>
    <rect x="190" y="560" width="20" height="16"/>
  </g>
  <text x="228" y="573" font-size="15" font-weight="bold" fill="#000">-X1</text>
  <text x="228" y="590" font-size="10" fill="#333">1 - 3</text>

  <!-- -M1 motor pompa -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <line x1="160" y1="576" x2="160" y2="630"/>
    <line x1="180" y1="576" x2="180" y2="620"/>
    <line x1="200" y1="576" x2="200" y2="630"/>
    <circle cx="180" cy="660" r="34"/>
  </g>
  <text x="168" y="666" font-size="16" font-weight="bold" fill="#000">M</text>
  <text x="172" y="682" font-size="10" fill="#000">3~</text>
  <text x="228" y="664" font-size="15" font-weight="bold" fill="#000">-M1</text>
  <text x="228" y="682" font-size="10" fill="#333">Pompa submersibila 15kW</text>

  <!-- circuit de comanda 24VDC -->
  <g stroke="#000" stroke-width="1.4">
    <line x1="560" y1="200" x2="1120" y2="200"/>
    <line x1="560" y1="620" x2="1120" y2="620"/>
  </g>
  <text x="520" y="204" font-size="12" fill="#000">+24V</text>
  <text x="528" y="624" font-size="12" fill="#000">0V</text>

  <!-- -KF1 releu monitorizare faze -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <line x1="640" y1="90" x2="640" y2="260"/>
    <line x1="660" y1="110" x2="660" y2="260"/>
    <line x1="680" y1="130" x2="680" y2="260"/>
    <rect x="620" y="260" width="80" height="70"/>
    <line x1="660" y1="330" x2="660" y2="620"/>
  </g>
  <text x="712" y="290" font-size="15" font-weight="bold" fill="#000">-KF1</text>
  <text x="712" y="308" font-size="10" fill="#333">Monitorizare faze</text>

  <!-- -PLC1 modul logic -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <rect x="820" y="300" width="200" height="140"/>
    <line x1="850" y1="200" x2="850" y2="300"/>
    <line x1="990" y1="440" x2="990" y2="620"/>
    <line x1="850" y1="440" x2="850" y2="520"/>
  </g>
  <g font-size="10" fill="#000">
    <text x="832" y="322">I1</text><text x="862" y="322">I2</text><text x="892" y="322">I3</text>
    <text x="832" y="432">Q1</text><text x="862" y="432">Q2</text>
  </g>
  <text x="890" y="376" font-size="15" font-weight="bold" fill="#000">-PLC1</text>
  <text x="868" y="394" font-size="10" fill="#333">LOGO! 24RCE + DM8</text>

  <!-- bobina -KM1 comandata din PLC -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <rect x="830" y="520" width="40" height="40"/>
    <line x1="850" y1="560" x2="850" y2="620"/>
    <line x1="830" y1="520" x2="870" y2="560"/>
  </g>
  <text x="880" y="546" font-size="11" fill="#000">A1/A2 bobina KM1</text>

  <!-- cartus indicator EPLAN -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <rect x="20" y="740" width="1148" height="80"/>
    <line x1="420" y1="740" x2="420" y2="820"/>
    <line x1="820" y1="740" x2="820" y2="820"/>
    <line x1="1000" y1="740" x2="1000" y2="820"/>
  </g>
  <g fill="#000">
    <text x="36" y="766" font-size="12">Proiect: CMD-2026-004</text>
    <text x="36" y="790" font-size="16" font-weight="bold">Tablou Comanda Pompa Hidraulica</text>
    <text x="36" y="810" font-size="10">Export EPLAN Electric P8 - format SVG</text>
    <text x="436" y="770" font-size="14" font-weight="bold">Circuit forta si comanda pompa</text>
    <text x="436" y="794" font-size="11">Alimentare 400V AC / Comanda 24V DC</text>
    <text x="836" y="770" font-size="11">Desenat: M. Ionescu</text>
    <text x="836" y="790" font-size="11">Verificat: E. Radu</text>
    <text x="1016" y="770" font-size="11">Pagina</text>
    <text x="1016" y="800" font-size="22" font-weight="bold">= 1 / 1</text>
  </g>
</svg>
